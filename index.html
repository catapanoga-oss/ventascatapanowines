<script>
    const SHEETS_URL = "https://script.google.com/macros/s/AKfycbywSGY9kdALfrhaxdUB2CpyHVYt3c6B3CTALqrs5Xfsg1DwsO8wjqk8MHUWQTUtuaFhAw/exec";
    const ADMIN_PIN = "1234";

    let catalogo = [];
    let carrito = [];
    let ventas = [];
    let vendedorActual = "Vendedor 1";
    let categoriaSeleccionada = "TODAS";
    let productoSeleccionadoRepo = null;

    window.onload = async function() {
        await sincronizarConSheets();
    };

    async function sincronizarConSheets() {
        const grilla = document.getElementById('grilla-productos');
        try {
            let res = await fetch(SHEETS_URL + "?action=obtenerTodo", { redirect: "follow" });
            if (!res.ok) throw new Error("Error en la respuesta de la red");
            
            let data = await res.json();
            catalogo = data.catalogo || [];
            ventas = data.ventas || [];
            
            renderizarCategorias();
            renderizarCatalogo();
            actualizarSelectReposicion();
        } catch (err) {
            console.error("Error sincronizando con Sheets:", err);
            if (grilla) {
                grilla.innerHTML = `
                    <div class="col-span-2 text-center text-red-400 py-6 text-xs font-bold bg-red-950/40 p-3 rounded-xl border border-red-800">
                        ⚠️ Error de conexión con Google Sheets.
                    </div>`;
            }
        }
    }

    async function enviarASheets(payload) {
        try {
            await fetch(SHEETS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            });
        } catch (e) {
            console.error("Error al enviar a Sheets:", e);
        }
    }

    window.solicitarAccesoAdmin = function() {
        let pin = prompt("🔒 PIN Administrador:");
        if (pin === ADMIN_PIN) abrirModalInventario();
        else if (pin !== null) alert("PIN incorrecto");
    }

    function renderizarCategorias() {
        const categorias = ["TODAS", ...new Set(catalogo.map(p => p.categoria))];
        const cont = document.getElementById('contenedor-categorias');
        if (!cont) return;
        cont.innerHTML = '';
        categorias.forEach(cat => {
            let activa = cat === categoriaSeleccionada;
            cont.innerHTML += `<button onclick="seleccionarCategoria('${cat}')" class="px-3 py-1 rounded-full whitespace-nowrap transition ${activa ? 'bg-indigo-600 text-white font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">${cat}</button>`;
        });
    }

    window.seleccionarCategoria = function(cat) {
        categoriaSeleccionada = cat;
        renderizarCategorias();
        renderizarCatalogo();
    }

    function renderizarCatalogo() {
        const grilla = document.getElementById('grilla-productos');
        if (!grilla) return;
        grilla.innerHTML = '';
        
        let buscador = document.getElementById('input-buscador');
        let filtroTexto = buscador ? buscador.value.trim().toLowerCase() : '';

        let filtrados = catalogo.filter(p => {
            let coincideCat = categoriaSeleccionada === "TODAS" || p.categoria === categoriaSeleccionada;
            let coincideTexto = String(p.nombre || '').toLowerCase().includes(filtroTexto) || String(p.codigo || '').toLowerCase().includes(filtroTexto);
            return coincideCat && coincideTexto;
        });

        let badge = document.getElementById('badge-contador');
        if (badge) badge.innerText = `${filtrados.length} items`;
        
        if (filtrados.length === 0) {
            grilla.innerHTML = `<span class="col-span-2 text-center text-slate-400 py-6 text-xs">Sin productos en el catálogo. Usa el panel de Admin 🔐 para subir ítems.</span>`;
            return;
        }

        filtrados.forEach(prod => {
            grilla.innerHTML += `
                <button onclick="agregarAlCarrito('${prod.id}')" class="bg-slate-800 border border-slate-700 p-2.5 rounded-xl text-left flex flex-col relative hover:border-indigo-500 transition active:scale-95">
                    <span class="absolute top-2 right-2 text-[10px] bg-slate-700 px-1 rounded font-bold text-slate-300">#${prod.codigo}</span>
                    <span class="font-bold text-xs pr-6 text-slate-200">${prod.nombre}</span>
                    <div class="flex justify-between items-end mt-2">
                        <span class="text-indigo-400 font-black text-sm">$${Number(prod.precio).toLocaleString()}</span>
                        <span class="text-[10px] text-slate-400">Stock: ${prod.stock}</span>
                    </div>
                </button>`;
        });
    }

    window.filtrarCatalogo = function() { renderizarCatalogo(); }
    window.limpiarBuscador = function() {
        let buscador = document.getElementById('input-buscador');
        if (buscador) buscador.value = '';
        renderizarCatalogo();
    }

    window.agregarAlCarrito = function(id) {
        let prod = catalogo.find(p => p.id == id);
        if (!prod || prod.stock <= 0) { alert("Sin stock disponible"); return; }
        let item = carrito.find(i => i.id == id);
        if (item) item.cantidad++;
        else carrito.push({...prod, cantidad: 1});
        renderizarCarrito();
    }

    window.agregarMontoLibre = function() {
        let monto = parseFloat(prompt("Monto libre ($):"));
        if (!monto || monto <= 0) return;
        carrito.push({id: 'v_'+Date.now(), codigo: "VAR", nombre: "Varios", precio: monto, cantidad: 1, esMontoLibre: true});
        renderizarCarrito();
    }

    function renderizarCarrito() {
        const cont = document.getElementById('contenedor-items-carrito');
        if (!cont) return;
        cont.innerHTML = '';
        let total = 0;
        carrito.forEach(i => {
            total += i.precio * i.cantidad;
            cont.innerHTML += `<div class="flex justify-between text-xs py-1 border-b border-slate-700"><span>${i.nombre} (x${i.cantidad})</span><b>$${(i.precio * i.cantidad).toLocaleString()}</b></div>`;
        });
        document.getElementById('total-carrito').innerText = `$${total.toLocaleString()}`;
    }

    window.vaciarCarrito = function() { carrito = []; renderizarCarrito(); }

    window.abrirModalCobro = function() {
        if (carrito.length === 0) { alert("El carrito está vacío"); return; }
        document.getElementById('modal-cobro').classList.remove('hidden');
    }
    window.cerrarModalCobro = function() { document.getElementById('modal-cobro').classList.add('hidden'); }

    window.calcularTotalVisita = function() {
        let pax = parseInt(document.getElementById('input-cant-personas').value) || 1;
        let precio = parseFloat(document.getElementById('input-precio-unitario').value) || 0;
        document.getElementById('modal-total-calculado').innerText = `$${(pax * precio).toLocaleString()}`;
    }

    window.confirmarYProcesarVenta = async function() {
        let agencia = document.getElementById('input-agencia').value || "Particular";
        let guia = document.getElementById('input-guia').value || "Sin Guía";
        let pax = parseInt(document.getElementById('input-cant-personas').value) || 1;
        let precioU = parseFloat(document.getElementById('input-precio-unitario').value) || 0;
        let totalVisita = pax * precioU;
        let totalProd = carrito.reduce((acc, i) => acc + (i.precio * i.cantidad), 0);

        let fechaActual = new Date().toLocaleDateString();
        let horaActual = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        // Descontar stock y registrar movimientos individuales por producto
        for (let item of carrito) {
            if (!item.esMontoLibre) {
                let p = catalogo.find(x => x.id == item.id);
                if (p) {
                    p.stock = Number(p.stock) - Number(item.cantidad);
                    
                    // Enviar registro a movimientos_stock
                    await enviarASheets({
                        action: "registrarMovimiento",
                        movimiento: {
                            id: 'm_' + Date.now() + "_" + Math.floor(Math.random()*1000),
                            fecha: fechaActual,
                            hora: horaActual,
                            tipo: "VENTA",
                            producto: item.nombre,
                            cantidad: -item.cantidad,
                            usuario: vendedorActual
                        }
                    });
                }
            }
        }

        let ventaObj = {
            id: 'v_' + Date.now(),
            fecha: fechaActual,
            hora: horaActual,
            vendedor: vendedorActual,
            agencia: agencia,
            guia: guia,
            cantPersonas: pax,
            precioUnitario: precioU,
            total: totalVisita > 0 ? totalVisita + totalProd : totalProd,
            productosDetalle: carrito.map(i => `${i.nombre} (x${i.cantidad})`).join("; ")
        };

        ventas.push(ventaObj);
        await enviarASheets({action: "guardarVenta", venta: ventaObj});
        await enviarASheets({action: "actualizarCatalogo", catalogo: catalogo});

        alert("¡Venta y movimientos de stock registrados en Google Sheets!");
        cerrarModalCobro();
        vaciarCarrito();
        renderizarCatalogo();
    }

    window.abrirRendicion = function() {
        document.getElementById('modal-rendicion').classList.remove('hidden');
        let totalGen = ventas.reduce((acc, v) => acc + Number(v.total || 0), 0);
        document.getElementById('rendicion-total-general').innerText = `$${totalGen.toLocaleString()}`;
        
        let hist = document.getElementById('lista-historial-ventas');
        if (!hist) return;
        hist.innerHTML = '';
        ventas.slice().reverse().forEach(v => {
            hist.innerHTML += `<div class="p-2 border-b border-slate-700/50 text-xs flex justify-between"><div><b>${v.agencia}</b> (${v.guia})<br><small class="text-slate-400">${v.fecha} ${v.hora}</small></div><b class="text-emerald-400">$${Number(v.total).toLocaleString()}</b></div>`;
        });
    }
    window.cerrarRendicion = function() { document.getElementById('modal-rendicion').classList.add('hidden'); }

    window.abrirModalInventario = function() { document.getElementById('modal-inventario').classList.remove('hidden'); }
    window.cerrarModalInventario = function() { document.getElementById('modal-inventario').classList.add('hidden'); }

    function actualizarSelectReposicion() {
        let sel = document.getElementById('select-producto-reposicion');
        if (!sel) return;
        sel.innerHTML = '<option value="">-- Seleccionar --</option>';
        catalogo.forEach(p => { sel.innerHTML += `<option value="${p.id}">${p.nombre} (Stock: ${p.stock})</option>`; });
    }

    window.seleccionarProductoReposicion = function(id) {
        productoSeleccionadoRepo = catalogo.find(p => p.id == id);
        if (productoSeleccionadoRepo) {
            document.getElementById('repo-prod-nombre').innerText = productoSeleccionadoRepo.nombre;
            document.getElementById('panel-reposicion-detalle').classList.remove('hidden');
            document.getElementById('panel-reposicion-detalle').classList.add('flex');
        }
    }

    window.ejecutarAccionStock = async function() {
        if (!productoSeleccionadoRepo) return;
        let cant = parseInt(document.getElementById('input-cant-reposicion').value) || 0;
        productoSeleccionadoRepo.stock = Number(productoSeleccionadoRepo.stock) + cant;
        
        let fechaActual = new Date().toLocaleDateString();
        let horaActual = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        // Registrar reposición en movimientos_stock
        await enviarASheets({
            action: "registrarMovimiento",
            movimiento: {
                id: 'm_' + Date.now(),
                fecha: fechaActual,
                hora: horaActual,
                tipo: "REPOSICION",
                producto: productoSeleccionadoRepo.nombre,
                cantidad: cant,
                usuario: vendedorActual
            }
        });

        await enviarASheets({action: "actualizarCatalogo", catalogo: catalogo});
        alert("Stock y movimientos actualizados en Google Sheets");
        actualizarSelectReposicion();
        renderizarCatalogo();
    }

    window.importarDesdeTextoExcel = async function() {
        let texto = document.getElementById('textarea-excel').value;
        if (!texto) return;
        let lineas = texto.split('\n');
        catalogo = [];
        lineas.forEach((l, idx) => {
            let cols = l.split('\t');
            if (cols.length >= 4) {
                catalogo.push({
                    id: 'p_' + (Date.now() + idx),
                    codigo: cols[0].trim(),
                    nombre: cols[1].trim(),
                    categoria: cols[2].trim(),
                    precio: parseFloat(cols[3].trim().replace(/\./g, '').replace(',', '.')) || 0,
                    stock: parseInt(cols[4] ? cols[4].trim() : 0) || 0,
                    componentesStr: cols[5] ? cols[5].trim() : ''
                });
            }
        });
        await enviarASheets({action: "actualizarCatalogo", catalogo: catalogo});
        alert("¡Inventario subido correctamente!");
        renderizarCatalogo();
        actualizarSelectReposicion();
        cerrarModalInventario();
    }

    window.reiniciarCajaTurno = async function() {
        if (confirm("¿Reiniciar todas las ventas grabadas en Google Sheets?")) {
            ventas = [];
            await enviarASheets({action: "reiniciarVentas"});
            abrirRendicion();
        }
    }

    window.cambiarVendedor = function(v) { vendedorActual = v; document.getElementById('vendedor-label').innerText = `Vendedor: ${v}`; }
</script>
